name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TravModel.slnx --configfile NuGet.Config --locked-mode
      - run: dotnet test TravModel.slnx --no-restore --configuration Release
